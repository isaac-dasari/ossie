name: PR 338 conflict transport

on:
  push:
    branches:
      - pr338-conflict-transport-20260828
    paths:
      - .github/pr338-conflict-transport-trigger

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize verified tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/pr338-current-main.patch.gz.b64 | gzip -dc > /tmp/pr338.patch
          git rm .github/pr338-current-main.patch.gz.b64
          git rm .github/pr338-conflict-transport-trigger
          git rm .github/workflows/pr338-conflict-transport.yml
          git apply --check /tmp/pr338.patch
          git apply --index /tmp/pr338.patch
          tree=$(git write-tree)
          test "$tree" = "7b6a6176ec8304a21ce15bb961984df4ced343c9"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize PR 338 resolved tree"
          git push origin HEAD:pr338-conflict-transport-20260828
