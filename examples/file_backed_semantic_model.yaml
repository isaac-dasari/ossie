# File-backed Dataset Example
# Demonstrates a portable structured file source without requiring object-store access.

version: 0.2.0.dev0
semantic_model:
  - name: file_backed_example
    datasets:
      - name: events
        source:
          kind: file
          format: parquet
          locations:
            - s3://analytics-data/events/*.parquet
        fields:
          - name: event_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: event_id
